name: Build and Push Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # --------------------------------
      # 1. Checkout code
      # --------------------------------
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout code completed
        run: echo "Successfully completed - Checkout code"

      # --------------------------------
      # 2. Login to Docker Hub
      # --------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hub login completed
        run: echo "Successfully completed - Login to Docker Hub"

      # --------------------------------
      # 3. Set up Docker Buildx
      # --------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Buildx setup completed
        run: echo "Successfully completed - Set up Docker Buildx"

      # --------------------------------
      # 4. Build and Push Docker Image
      # --------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/todo-list:latest
            ${{ vars.DOCKERHUB_USERNAME }}/todo-list:${{ github.sha }}

      - name: Docker image build and push completed
        run: |
          echo "Successfully completed - Build Docker image"
          echo "Successfully completed - Push Docker image to Docker Hub"
          echo "Image: ${{ vars.DOCKERHUB_USERNAME }}/todo-list:latest"
          echo "Image: ${{ vars.DOCKERHUB_USERNAME }}/todo-list:${{ github.sha }}"

      # --------------------------------
      # 5. Deploy to EC2
      # --------------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}

          script: |

            echo "=========================================="
            echo "Starting deployment on EC2"
            echo "=========================================="


            # --------------------------------
            # 5.1 Check Docker
            # --------------------------------
            echo "Checking Docker..."

            docker --version

            echo "Successfully completed - Docker check"


            # --------------------------------
            # 5.2 Pull latest Docker image
            # --------------------------------
            echo "Pulling Docker image..."

            docker pull ${{ vars.DOCKERHUB_USERNAME }}/todo-list:latest

            echo "Successfully completed - Docker image pull"


            # --------------------------------
            # 5.3 Stop existing container
            # --------------------------------
            echo "Stopping existing container..."

            docker stop todo-list || true

            echo "Successfully completed - Existing container stopped"


            # --------------------------------
            # 5.4 Remove existing container
            # --------------------------------
            echo "Removing existing container..."

            docker rm todo-list || true

            echo "Successfully completed - Existing container removed"


            # --------------------------------
            # 5.5 Create and start new container
            # --------------------------------
            echo "Creating new Docker container..."

            docker run -d \
              --name todo-list \
              -p 8080:8080 \
              --restart unless-stopped \
              ${{ vars.DOCKERHUB_USERNAME }}/todo-list:latest

            echo "Successfully completed - New container created"


            # --------------------------------
            # 5.6 Check running container
            # --------------------------------
            echo "Checking running containers..."

            docker ps

            echo "Successfully completed - Container is running"


            # --------------------------------
            # 5.7 Check Spring Boot logs
            # --------------------------------
            echo "Checking Spring Boot application logs..."

            docker logs --tail 50 todo-list

            echo "Successfully completed - Spring Boot application started"


            # --------------------------------
            # 5.8 Remove unused Docker images
            # --------------------------------
            echo "Cleaning unused Docker images..."

            docker image prune -f

            echo "Successfully completed - Docker cleanup"


            echo "=========================================="
            echo "Successfully completed - EC2 deployment"
            echo "=========================================="
