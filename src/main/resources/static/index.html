<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Spring Boot Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .badge-brand {
            display: inline-block;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0f172a;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0.3rem;
            font-size: 0.95rem;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.2rem;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            font-size: 1.3rem;
        }

        .stat-info h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .stat-info p {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0.1rem;
        }

        /* Create Todo Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 0.75rem;
            align-items: end;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main);
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1.1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.15s ease;
            gap: 0.4rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-outline:hover {
            background: #f1f5f9;
        }

        .btn-danger {
            background: #fee2e2;
            color: var(--danger);
        }
        .btn-danger:hover {
            background: #fecaca;
        }

        /* Filter Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .filter-tabs {
            display: flex;
            background: #e2e8f0;
            border-radius: 8px;
            padding: 3px;
        }

        .filter-tab {
            padding: 0.4rem 0.9rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-tab.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .search-sort-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .search-box {
            position: relative;
            min-width: 200px;
        }

        /* Todo List */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .todo-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-sm);
        }

        .todo-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .todo-item.completed {
            background: #f8fafc;
            border-color: #e2e8f0;
        }

        .todo-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .todo-checkbox:checked {
            background: var(--success);
            border-color: var(--success);
        }

        .todo-checkbox:checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: 700;
        }

        .todo-content {
            flex: 1;
            min-width: 0;
        }

        .todo-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            transition: color 0.15s;
        }

        .todo-item.completed .todo-title {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .todo-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .todo-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.4rem;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.2rem 0.55rem;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .badge-priority-HIGH {
            background: #fee2e2;
            color: #b91c1c;
        }

        .badge-priority-MEDIUM {
            background: #fef3c7;
            color: #b45309;
        }

        .badge-priority-LOW {
            background: #e0e7ff;
            color: #4338ca;
        }

        .badge-date {
            background: #f1f5f9;
            color: #475569;
        }

        .badge-date.overdue {
            background: #fee2e2;
            color: #b91c1c;
            font-weight: 700;
        }

        .todo-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .action-btn {
            background: none;
            border: none;
            padding: 0.4rem;
            cursor: pointer;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 1rem;
            transition: all 0.15s;
        }

        .action-btn:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .action-btn.delete:hover {
            color: var(--danger);
            background: #fee2e2;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            background: white;
            border-radius: var(--radius);
            border: 2px dashed var(--border);
            color: var(--text-muted);
        }

        .empty-state h4 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
            color: var(--text-main);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(2px);
            display: none;
            place-items: center;
            z-index: 100;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: grid;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius);
            padding: 1.75rem;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .modal-header h3 {
            font-size: 1.2rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 200;
        }

        .toast {
            background: #0f172a;
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-size: 0.9rem;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="badge-brand">Spring Boot &bull; In-Memory List</span>
        <h1>Todo Master</h1>
        <p>A fast, clean RESTful Todo application pre-populated with data</p>
    </header>

    <!-- Stats Section -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon" style="background: #eef2ff; color: #4f46e5;">📋</div>
            <div class="stat-info">
                <h3>Total Tasks</h3>
                <p id="stat-total">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: #dcfce7; color: #16a34a;">✅</div>
            <div class="stat-info">
                <h3>Completed</h3>
                <p id="stat-completed">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: #fef3c7; color: #d97706;">⏳</div>
            <div class="stat-info">
                <h3>Pending</h3>
                <p id="stat-pending">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: #f3e8ff; color: #9333ea;">📈</div>
            <div class="stat-info">
                <h3>Progress</h3>
                <p id="stat-progress">0%</p>
            </div>
        </div>
    </div>

    <!-- Create Todo Card -->
    <div class="card">
        <form id="createForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="createTitle">Task Title *</label>
                    <input type="text" id="createTitle" placeholder="What needs to be done?" required maxlength="150">
                </div>
                <div class="form-group">
                    <label for="createPriority">Priority</label>
                    <select id="createPriority">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HIGH">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="createDueDate">Due Date</label>
                    <input type="date" id="createDueDate">
                </div>
                <button type="submit" class="btn btn-primary" style="height: 42px;">
                    + Add Task
                </button>
            </div>
            <div class="form-group" style="margin-top: 0.75rem;">
                <label for="createDesc">Description (optional)</label>
                <input type="text" id="createDesc" placeholder="Additional details or notes..." maxlength="500">
            </div>
        </form>
    </div>

    <!-- Filter & Sort Toolbar -->
    <div class="toolbar">
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="active">Active</button>
            <button class="filter-tab" data-filter="completed">Completed</button>
        </div>

        <div class="search-sort-group">
            <input type="text" id="searchInput" placeholder="Search tasks..." style="width: 180px;">
            <select id="priorityFilter" style="width: 130px;">
                <option value="">All Priorities</option>
                <option value="HIGH">High</option>
                <option value="MEDIUM">Medium</option>
                <option value="LOW">Low</option>
            </select>
            <select id="sortBy" style="width: 140px;">
                <option value="id">Sort: Oldest</option>
                <option value="id_desc">Sort: Newest</option>
                <option value="duedate">Sort: Due Date</option>
                <option value="priority">Sort: Priority</option>
                <option value="title">Sort: Title</option>
            </select>
            <button id="clearCompletedBtn" class="btn btn-outline" title="Delete completed tasks">
                Clear Done
            </button>
            <button id="resetBtn" class="btn btn-outline" title="Reset sample populated data">
                🔄 Reset
            </button>
        </div>
    </div>

    <!-- Todo List Container -->
    <div id="todoList" class="todo-list">
        <!-- Rendered items go here -->
    </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Edit Task</h3>
            <button class="close-btn" id="closeEditModal">&times;</button>
        </div>
        <form id="editForm">
            <input type="hidden" id="editId">
            <div class="form-group" style="margin-bottom: 0.9rem;">
                <label for="editTitle">Title *</label>
                <input type="text" id="editTitle" required maxlength="150">
            </div>
            <div class="form-group" style="margin-bottom: 0.9rem;">
                <label for="editDesc">Description</label>
                <textarea id="editDesc" rows="3" maxlength="500"></textarea>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
                <div class="form-group">
                    <label for="editPriority">Priority</label>
                    <select id="editPriority">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editDueDate">Due Date</label>
                    <input type="date" id="editDueDate">
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" id="editCompleted" style="width: 18px; height: 18px;">
                    <span>Mark as Completed</span>
                </label>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                <button type="button" class="btn btn-outline" id="cancelEditBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
    const API_BASE = '/api/todos';

    // State
    let currentFilter = 'all'; // all, active, completed
    let searchDebounce = null;

    // Elements
    const todoListEl = document.getElementById('todoList');
    const createForm = document.getElementById('createForm');
    const searchInput = document.getElementById('searchInput');
    const priorityFilter = document.getElementById('priorityFilter');
    const sortBy = document.getElementById('sortBy');
    const filterTabs = document.querySelectorAll('.filter-tab');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Edit Modal Elements
    const editModal = document.getElementById('editModal');
    const editForm = document.getElementById('editForm');
    const closeEditModal = document.getElementById('closeEditModal');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        loadTodos();
        loadStats();
    });

    // Event Listeners
    filterTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            filterTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentFilter = tab.dataset.filter;
            loadTodos();
        });
    });

    searchInput.addEventListener('input', () => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(loadTodos, 250);
    });

    priorityFilter.addEventListener('change', loadTodos);
    sortBy.addEventListener('change', loadTodos);

    createForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('createTitle').value.trim();
        const description = document.getElementById('createDesc').value.trim();
        const priority = document.getElementById('createPriority').value;
        const dueDate = document.getElementById('createDueDate').value || null;

        if (!title) return;

        try {
            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, priority, dueDate })
            });

            if (res.ok) {
                createForm.reset();
                showToast('Task added successfully!');
                loadTodos();
                loadStats();
            } else {
                const err = await res.json();
                showToast(err.message || 'Failed to add task');
            }
        } catch (error) {
            showToast('Network error while adding task');
        }
    });

    clearCompletedBtn.addEventListener('click', async () => {
        if (!confirm('Are you sure you want to remove all completed tasks?')) return;
        try {
            const res = await fetch(`${API_BASE}/completed`, { method: 'DELETE' });
            if (res.ok) {
                const data = await res.json();
                showToast(`Removed ${data.deletedCount} completed task(s)`);
                loadTodos();
                loadStats();
            }
        } catch (e) {
            showToast('Failed to clear completed tasks');
        }
    });

    resetBtn.addEventListener('click', async () => {
        try {
            const res = await fetch(`${API_BASE}/reset`, { method: 'POST' });
            if (res.ok) {
                showToast('Reset back to sample populated data');
                loadTodos();
                loadStats();
            }
        } catch (e) {
            showToast('Failed to reset data');
        }
    });

    // Load Todos with filters
    async function loadTodos() {
        let url = `${API_BASE}?`;
        const params = new URLSearchParams();

        if (currentFilter === 'active') params.append('completed', 'false');
        if (currentFilter === 'completed') params.append('completed', 'true');

        const priority = priorityFilter.value;
        if (priority) params.append('priority', priority);

        const search = searchInput.value.trim();
        if (search) params.append('search', search);

        const sortVal = sortBy.value;
        if (sortVal === 'id_desc') {
            params.append('sortBy', 'id');
            params.append('order', 'desc');
        } else {
            params.append('sortBy', sortVal);
            params.append('order', 'asc');
        }

        try {
            const res = await fetch(url + params.toString());
            const todos = await res.json();
            renderTodoList(todos);
        } catch (e) {
            todoListEl.innerHTML = `<div class="empty-state"><h4>Error loading tasks</h4><p>Check if the Spring Boot server is running.</p></div>`;
        }
    }

    // Load Stats
    async function loadStats() {
        try {
            const res = await fetch(`${API_BASE}/stats`);
            if (res.ok) {
                const stats = await res.json();
                document.getElementById('stat-total').textContent = stats.total;
                document.getElementById('stat-completed').textContent = stats.completed;
                document.getElementById('stat-pending').textContent = stats.pending;
                document.getElementById('stat-progress').textContent = `${stats.completionPercentage}%`;
            }
        } catch (e) {
            console.error('Failed to load stats', e);
        }
    }

    // Render Todos
    function renderTodoList(todos) {
        if (!todos || todos.length === 0) {
            todoListEl.innerHTML = `
                <div class="empty-state">
                    <h4>No tasks found</h4>
                    <p>Try adjusting your search/filter or add a new task above.</p>
                </div>
            `;
            return;
        }

        const todayStr = new Date().toISOString().split('T')[0];

        todoListEl.innerHTML = todos.map(todo => {
            const isOverdue = todo.dueDate && todo.dueDate < todayStr && !todo.completed;
            return `
                <div class="todo-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
                    <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''}
                        onchange="toggleTodo(${todo.id})">
                    <div class="todo-content">
                        <div class="todo-title">${escapeHtml(todo.title)}</div>
                        ${todo.description ? `<div class="todo-desc">${escapeHtml(todo.description)}</div>` : ''}
                        <div class="todo-meta">
                            <span class="badge badge-priority-${todo.priority}">${todo.priority}</span>
                            ${todo.dueDate ? `
                                <span class="badge badge-date ${isOverdue ? 'overdue' : ''}">
                                    ${isOverdue ? '⚠️ Overdue: ' : '📅 Due: '} ${todo.dueDate}
                                </span>
                            ` : ''}
                        </div>
                    </div>
                    <div class="todo-actions">
                        <button class="action-btn" title="Edit" onclick="openEdit(${todo.id})">✏️</button>
                        <button class="action-btn delete" title="Delete" onclick="deleteTodo(${todo.id})">🗑️</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Toggle todo
    async function toggleTodo(id) {
        try {
            const res = await fetch(`${API_BASE}/${id}/toggle`, { method: 'PATCH' });
            if (res.ok) {
                loadTodos();
                loadStats();
            } else {
                showToast('Failed to toggle status');
            }
        } catch (e) {
            showToast('Network error');
        }
    }

    // Delete todo
    async function deleteTodo(id) {
        if (!confirm('Are you sure you want to delete this task?')) return;
        try {
            const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
            if (res.ok) {
                showToast('Task deleted');
                loadTodos();
                loadStats();
            }
        } catch (e) {
            showToast('Failed to delete task');
        }
    }

    // Open Edit Modal
    async function openEdit(id) {
        try {
            const res = await fetch(`${API_BASE}/${id}`);
            if (res.ok) {
                const todo = await res.json();
                document.getElementById('editId').value = todo.id;
                document.getElementById('editTitle').value = todo.title;
                document.getElementById('editDesc').value = todo.description || '';
                document.getElementById('editPriority').value = todo.priority;
                document.getElementById('editDueDate').value = todo.dueDate || '';
                document.getElementById('editCompleted').checked = todo.completed;

                editModal.classList.add('active');
            }
        } catch (e) {
            showToast('Failed to fetch task details');
        }
    }

    function closeModal() {
        editModal.classList.remove('active');
    }

    closeEditModal.addEventListener('click', closeModal);
    cancelEditBtn.addEventListener('click', closeModal);
    editModal.addEventListener('click', (e) => {
        if (e.target === editModal) closeModal();
    });

    // Save Edit Form
    editForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editId').value;
        const title = document.getElementById('editTitle').value.trim();
        const description = document.getElementById('editDesc').value.trim();
        const priority = document.getElementById('editPriority').value;
        const dueDate = document.getElementById('editDueDate').value || null;
        const completed = document.getElementById('editCompleted').checked;

        try {
            const res = await fetch(`${API_BASE}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, priority, dueDate, completed })
            });

            if (res.ok) {
                closeModal();
                showToast('Task updated successfully');
                loadTodos();
                loadStats();
            } else {
                const err = await res.json();
                showToast(err.message || 'Failed to update task');
            }
        } catch (e) {
            showToast('Network error while saving changes');
        }
    });

    // Utility
    function showToast(msg) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>"']/g, function(m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m];
        });
    }
</script>

</body>
</html>
